{% load i18n %}
{% get_current_language as admin_language %}
<form id="admin-language-form" method="post" action="{% url 'admin_set_language' %}" data-unsaved-message="{% translate 'You have unsaved changes. Switching language will discard them. Continue?' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <label for="admin-language-select">{% translate "Language" %}</label>
    <select name="language" id="admin-language-select">
        <option value="zh-hant" {% if admin_language == 'zh-hant' %}selected{% endif %}>繁體中文</option>
        <option value="zh-hans" {% if admin_language == 'zh-hans' %}selected{% endif %}>简体中文</option>
        <option value="en" {% if admin_language == 'en' %}selected{% endif %}>English</option>
    </select>
    <button type="submit">{% translate "Apply" %}</button>
</form>
